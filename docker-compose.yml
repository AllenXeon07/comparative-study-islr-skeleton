services:
  dev-container:
    build: .
    container_name: gpu_ai_dev_env
    volumes:
      - .:/app
    ports:
      - "8888:8888"
    gpus: all
    environment:
      - KERAS_BACKEND=torch
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    tty: true
    stdin_open: true
